name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black pytest
          if [ -f apps/api/requirements.txt ]; then pip install -r apps/api/requirements.txt; fi
          if [ -f apps/worker/requirements.txt ]; then pip install -r apps/worker/requirements.txt; fi
      - name: Lint with flake8
        run: |
          flake8 apps/api apps/worker
      - name: Check formatting with black
        run: |
          black --check apps/api apps/worker

  lint-and-build-node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: ./apps/web
        run: npm ci
      - name: Lint
        working-directory: ./apps/web
        run: npm run lint
      - name: Build
        working-directory: ./apps/web
        run: npm run build
